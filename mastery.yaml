schema_version: 1
atlas_id: flutter-reference-atlas
epoch: "2026-08-28"
promise: >-
  Flutterの公開アプリ開発について、学習者が仕組みと境界を理解し、実務者が方式を選び実装し、
  検証者と運用者が一次資料および再実行可能な証拠から品質、障害、互換性を判断し、
  保守者とAgentがCoverage外を捏造せず安全に進化させられる参照経路を提供する。
audiences: [learner, practitioner, architect, operator, maintainer, reviewer, educator, agent]
outcomes:
  - id: understand
    title: Flutterの原理と境界を説明できる
    target_sets: [baseline, language-platform]
  - id: choose
    title: 制約から実装方式を選択できる
    target_sets: [product, language-platform, quality]
  - id: build
    title: 公開Surfaceで製品を構築できる
    target_sets: [product, language-platform, execution]
  - id: verify
    title: 主張を試験と証拠で検証できる
    target_sets: [baseline, product, execution, quality]
  - id: operate
    title: アプリを観測し安全に運用できる
    target_sets: [product, execution, quality]
  - id: troubleshoot
    title: 失敗を再現し診断・復旧できる
    target_sets: [product, execution, quality]
  - id: evolve
    title: 互換性を守って移行できる
    target_sets: [baseline, language-platform, quality]
  - id: delegate
    title: Agentへ委任し結果をReviewできる
    target_sets: [skill]
surfaces:
  - id: orientation-scope
    title: 定義・目的・境界
    applicability: required
    rationale: Flutterで扱う公開アプリ開発Surfaceと対象外を明示し、誤った入口や完全性の誤認を防ぐために必要である。
    target_sets: [baseline, language-platform]
    required_deliverables: [concept, decision]
  - id: foundations-mechanics
    title: 原理・内部機構・Invariant
    applicability: required
    rationale: Widget lifecycle、状態、非同期処理、Platform境界の挙動を表面的なAPI利用ではなく説明するために必要である。
    target_sets: [language-platform, execution]
    required_deliverables: [concept, lab]
  - id: architecture-design
    title: Architecture・設計
    applicability: required
    rationale: UI、状態、Repository、Platform依存を試験可能で保守可能な責任境界へ分解するために必要である。
    target_sets: [product, language-platform]
    required_deliverables: [decision, reference-implementation]
  - id: implementation-construction
    title: 実装・構築
    applicability: required
    rationale: Adaptive UIと状態遷移を公開Surfaceだけで構築し、実行可能な参照実装とLabへ結び付けるために必要である。
    target_sets: [product, execution]
    required_deliverables: [reference-implementation, lab]
  - id: testing-verification
    title: 試験・検証
    applicability: required
    rationale: 正常、境界、拒否、障害、復旧の主張を固定HarnessとArtifactで反復検証するために必要である。
    target_sets: [product, execution, quality]
    required_deliverables: [test, evidence]
  - id: failure-recovery
    title: 失敗・診断・回復
    applicability: required
    rationale: 非同期競合、Lifecycle、永続化、Platform統合の失敗を隔離して再現し、安全に復旧するために必要である。
    target_sets: [product, execution, quality]
    required_deliverables: [failure-catalog, runbook, evidence]
  - id: operations-observability
    title: 運用・Observability
    applicability: required
    rationale: 利用者環境で発生する状態不整合、性能劣化、障害を観測し、証拠から診断するために必要である。
    target_sets: [product, quality]
    required_deliverables: [runbook, evidence]
  - id: security-privacy-safety
    title: Security・Privacy・Safety
    applicability: required
    rationale: 入力、秘密、端末権限、保存Data、外部連携の境界を安全に扱い、公開前に検証するために必要である。
    target_sets: [product, quality]
    required_deliverables: [security-review, test]
  - id: performance-capacity-cost
    title: 性能・容量・Cost
    applicability: required
    rationale: Frame、Memory、起動、通信、Artifact容量の予算と劣化を測り、設計判断へ戻すために必要である。
    target_sets: [product, quality]
    required_deliverables: [benchmark, evidence]
  - id: compatibility-integration
    title: 互換性・Integration
    applicability: required
    rationale: FlutterとDartのVersion、公式6 Platform、Host toolchainの差を区別して統合判断するために必要である。
    target_sets: [baseline, language-platform, execution]
    required_deliverables: [test, evidence]
  - id: migration-evolution-deprecation
    title: 移行・進化・廃止
    applicability: required
    rationale: SDKや公開APIの変更時に利用者挙動と証拠の有効範囲を壊さず移行するために必要である。
    target_sets: [baseline, language-platform, quality]
    required_deliverables: [migration-guide, test]
  - id: decision-comparison
    title: 選択・比較・Trade-off
    applicability: required
    rationale: 状態管理、実行Profile、Platform対応の条件、利点、失敗、Costを同じ基準で比較するために必要である。
    target_sets: [product, language-platform, quality]
    required_deliverables: [decision, benchmark]
  - id: provenance-rights
    title: 出典・来歴・権利
    applicability: required
    rationale: 一次資料、SDK由来物、Container、依存物、独自実装の来歴と再配布条件を追跡するために必要である。
    target_sets: [baseline, quality]
    required_deliverables: [provenance-record, evidence]
  - id: agent-skill
    title: Agent Skill・評価
    applicability: required
    rationale: AgentがCoverage状態と一次資料を守り、適切な実装、Lab、Evidence、未達報告へ到達するために必要である。
    target_sets: [skill]
    required_deliverables: [skill-reference, skill-eval]
