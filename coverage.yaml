schema_version: 1
atlas_id: flutter-reference-atlas
epoch: "2026-08-28"
authority_lock_digest: sha256:7a6d974ebd7028cf843df10e39b2db00b19fbc13d87994e44184cab45f98a18f
target_sets:
  - id: baseline
    title: 固定SDKと一次資料
    sequence: 1
    completion_required: true
    exit_criteria:
      - Flutter、Engine、Dart、DevToolsのVersionとrevisionを固定すること
      - Authority LockとRuntime InventoryのDigestを再計算できること
  - id: product
    title: Production Reference Product
    sequence: 2
    completion_required: true
    exit_criteria:
      - Adaptive UI、状態遷移、永続化境界を自動試験できること
      - 正常、拒否、障害、復旧の代表フローを再実行できること
  - id: language-platform
    title: FlutterとDartの公開能力
    sequence: 3
    completion_required: true
    exit_criteria:
      - 固定SDKの公開SurfaceをCapabilityへ欠落なく分類すること
      - Platform固有能力を実行環境とEvidenceへ接続すること
  - id: execution
    title: 再実行可能なLab
    sequence: 4
    completion_required: true
    exit_criteria:
      - local、container、simulatorのSetupからCleanupを自動化すること
      - 各Labの決定論範囲と失敗注入の隔離を明示すること
  - id: quality
    title: 品質、運用、移行
    sequence: 5
    completion_required: true
    exit_criteria:
      - Test、性能、Accessibility、Security、配布判断を証拠化すること
      - Upgrade、Incident、BackupとRestoreのRunbookを検証すること
  - id: skill
    title: Router Skillと評価
    sequence: 6
    completion_required: true
    exit_criteria:
      - 一つのRouterがCapability、Lab、Evidenceへ正しく誘導すること
      - Coverage外と権限外の依頼を捏造または実行せず返すこと
targets:
